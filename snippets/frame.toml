# Frame block — the shared opening of every workflow: both planning workers
# analyze the problem independently (think-holistic), then the architect
# synthesizes the sharper direction from the two reads (compare-notes).

[[snippets]]
key = "think-holistic"
expand = '''
This turn is analysis, not building — work through the problem and the design before any code changes. Reason holistically, grounded in the actual code, not assumptions.

1. **Read the relevant code** to see how things work today. Trace real data/control flow, note existing constraints and why they exist, cite the files/functions you read. Without this, "first principles" is guessing.
2. **Interview me about ambiguous product intent** (fuzzy terms, unclear scope, priorities you're guessing at) and **push back if my framing seems off**. Route and write every question per **How to ask questions** below. Don't ask what code can answer — you've just read it. **For clear, targeted bug fixes, skip this step.**
3. **State the real problem** and the underlying goal **in your own words**, informed by what you read and learned.
4. **Evaluate the current design** against the goal — is this a *local* change the structure absorbs cleanly, or is the structure itself in the way? When the foundation fights the change, reach for **preparatory refactoring** (Kent Beck: *make the change easy, then make the easy change*) — reshape the foundation first so the feature becomes a natural addition.
5. **Explore the design space, then synthesize.** Sketch 2–3 approaches that make *genuinely different bets* — from a contained change within the subsystem's current structure to a rework of its architecture — so they stress-test each other instead of standing in as strawmen for a choice you've already made. Then recommend a direction built *from* that comparison, weighed by how fully it solves the root problem rather than how little it disturbs: combine the best of more than one where it helps, rather than adopt a single option whole. Name the tradeoff you're accepting, and where the decision is genuinely a judgment call, say so.

Don't patch a flawed design with another patch, and don't shy from structural change when it's justified — but back a "structurally wrong" claim with code and name its cost. Preparatory refactoring is earned only when the structure genuinely blocks the goal, never license to rewrite what merely looks imperfect.

## How to ask questions

Route every question you're tempted to ask into one of three lanes:

- **Product/direction forks** — real decisions with live options that are mine (intent, priorities, UX, scope). Ask these, in the form below. If there are none, say so and move on.
- **Implementation details** — yours. Decide, record the choice in your analysis, continue.
- **Technical unknowns that don't change the direction** — record these under **"Open technical questions — parked for the consult round"**, each with your working answer. I read this list without answering it; a later consultation or review round resolves it. Omit the list when it's empty.

Write each fork as if briefing a CEO: I decide from your words alone, not from the code or the session behind them. Each question carries why it matters now, what it means in plain product terms, the options with what each implies for the real user, and your recommendation. Batch them, clustered by topic — defer only a follow-up that a pending answer would decide or reshape. Before sending, check each against: could I decide from this text alone?

<example>
**Q2 — When a schedule import partially fails, do we save the good rows or reject the file?** This decides what a user sees after uploading a 500-task file with 3 bad rows. Save-partial gets them working immediately but they may not notice the 3 missing tasks; reject-whole is safe but turns one typo into a blocked afternoon. Recommendation: save-partial with a banner naming the failed rows — the blocked afternoon is the worse failure.
</example>'''

[[snippets]]
key = "compare-notes"
expand = '''
Another engineer analyzed the same problem independently. Compare notes and build the sharper direction — take what's genuinely stronger in their reasoning and combine it with yours, rather than defending your draft or averaging the two.

**Start at the goal.** If the two of you named a different real problem or a different underlying goal, settle that before anything else: every approach below it is being weighed against a different target, and that disagreement is usually the most valuable thing in the round.

**Update where they're right; hold where they're not**, and say why — don't shift just because they disagree, and **don't split the difference**. Settle a factual disagreement on what the code actually shows, not on who argued it better; where a difference is a real judgment call rather than a matter of fact, surface it as an open choice rather than forcing agreement.

Their analysis below:

---

$0'''
